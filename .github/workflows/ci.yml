name: CI

# Puerta de calidad del repositorio. Con dos programadores trabajando en
# paralelo, esto es lo que evita que una rama rompa a la otra.
#
# Vive en .github/ de la RAÍZ del repositorio: GitHub solo lee los
# workflows de ahí. La copia que estaba en platform/.github/ nunca corrió.
#
# Lo más importante: la verificación del esquema corre SIN base de datos
# (Postgres embebido), así que cada pull request valida las migraciones
# en menos de un minuto. El monorepo usa pnpm (platform/pnpm-lock.yaml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  esquema:
    name: Migraciones y seeds en Postgres embebido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verificar que las migraciones aplican en limpio
        run: node db/migrate.mjs --pglite --seed
      - name: Los seeds son idempotentes (dos pasadas, mismos conteos)
        run: node db/seed/verify/run-0003.mjs
      - name: Verificar que ninguna migración aplicada fue modificada
        working-directory: .
        run: |
          # Una migración ya desplegada es inmutable. Si cambió, el
          # runner falla, pero aquí lo detectamos antes con git.
          if git rev-parse origin/main >/dev/null 2>&1; then
            CAMBIADAS=$(git diff --name-only --diff-filter=M origin/main -- platform/db/migrations/ || true)
            if [ -n "$CAMBIADAS" ]; then
              echo "::error::Se modificaron migraciones ya existentes:"
              echo "$CAMBIADAS"
              echo "Crea una migración nueva en vez de editar una aplicada."
              exit 1
            fi
          fi

  contra-postgres-real:
    name: Migraciones contra Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: oncue
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node db/migrate.mjs "postgres://mc:mc@localhost:5432/oncue" --seed
      - name: Aplicar dos veces debe ser inocuo
        run: node db/migrate.mjs "postgres://mc:mc@localhost:5432/oncue" --seed
      - name: Rol de la aplicación para las pruebas (sin BYPASSRLS, miembro de mc_app y de mc_worker)
        # mc_app y mc_worker existen desde 0010 y son NOLOGIN; mc_app_ci es
        # el rol con el que la web se conectaría, más la membresía en
        # mc_worker para que asWorker también se ejercite sobre pg.
        run: |
          psql "postgres://mc:mc@localhost:5432/oncue" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE mc_app_ci LOGIN PASSWORD 'ci' IN ROLE mc_app; GRANT mc_worker TO mc_app_ci;"
      - name: Pruebas de @mc/db contra Postgres real (el runner de pg, no PGlite)
        env:
          TEST_DATABASE_URL: postgres://mc_app_ci:ci@localhost:5432/oncue
          TEST_DATABASE_ADMIN_URL: postgres://mc:mc@localhost:5432/oncue
        run: pnpm --filter @mc/db test

  calidad:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `pnpm verificar` = turbo run typecheck lint test --force
      # --concurrency=2. Está en platform/package.json (y en `make
      # verificar`) para que el CI y quien trabaja en local corran
      # EXACTAMENTE lo mismo: cuando los flags vivían solo aquí, el
      # comando documentado daba falsos verdes (--force: la caché de
      # turbo es local a la máquina y se comparte entre clones y
      # worktrees sin distinguir la rama) y falsos rojos
      # (--concurrency=2: @mc/db, @mc/worker y @mc/web levantan PGlite y
      # pg-boss a la vez y se quedan sin bucle de eventos).
      - run: pnpm verificar
      - name: Build del dashboard
        run: pnpm --filter @mc/web build
