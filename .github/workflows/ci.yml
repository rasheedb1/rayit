name: CI

# Puerta de calidad del repositorio. Con dos programadores trabajando en
# paralelo, esto es lo que evita que una rama rompa a la otra.
#
# Vive en .github/ de la RAÍZ del repositorio: GitHub solo lee los
# workflows de ahí. La copia que estaba en platform/.github/ nunca corrió.
#
# Lo más importante: la verificación del esquema corre SIN base de datos
# (Postgres embebido), así que cada pull request valida las migraciones
# en menos de un minuto. El monorepo usa pnpm (platform/pnpm-lock.yaml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  esquema:
    name: Migraciones y seeds en Postgres embebido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verificar que las migraciones aplican en limpio
        run: node db/migrate.mjs --pglite --seed
      - name: El reloj del harness no confunde el código con los datos
        # Ocho pruebas sin base de datos sobre db/seed/verify/reloj.mjs,
        # que es lo que desplaza CURRENT_DATE y now() en las pasadas de
        # abajo. Si desplazara mal, todo lo que viene después pasaría en
        # verde midiendo otra cosa.
        run: pnpm run seed:check:unit
      - name: Los seeds son idempotentes (hoy, mañana y dentro de seis semanas) y sus cifras son las esperadas
        # Sin argumento corre todos los verify/NNNN.sql: dos pasadas con
        # los mismos conteos, las cifras del mock por consulta (0002 y
        # 0003), una tercera pasada con el reloj adelantado un día, una
        # CUARTA que vuelve a sembrar la MISMA base seis semanas
        # después (el `make db.seed` sobre un Supabase que ya tiene la
        # demo) y una QUINTA que la repite sin mover el reloj. Exige que
        # la demo siga viva por los dos lados: planes al día, bandeja
        # fresca y serie hasta ayer, y también videos de los últimos 30
        # días, tablero con filas, menos de una semana sin publicar y
        # cero puntajes citando un corte ya superado.
        run: node db/seed/verify/run.mjs
      - name: La demo es la misma sembrada en limpio dentro de 40 días
        # Los seeds y los verify con CURRENT_DATE y now() a +40 días: lo
        # que ve un Supabase nuevo o la demo de un cliente el mes que
        # viene; la tercera pasada va a +41 y la cuarta a +81. Solo se
        # toleran las dos comprobaciones que comparan contra el now()
        # interno de una vista (i_pipeline_vencimientos y
        # l_conexiones_frescura); las cifras del pipeline y el recuento
        # de posts por conexión van en consultas aparte que sí fallan.
        run: node db/seed/verify/run.mjs --dias 40
      - name: Verificar que ninguna migración aplicada fue modificada
        working-directory: .
        run: |
          # Una migración ya desplegada es inmutable. Si cambió, el
          # runner falla, pero aquí lo detectamos antes con git.
          if git rev-parse origin/main >/dev/null 2>&1; then
            CAMBIADAS=$(git diff --name-only --diff-filter=M origin/main -- platform/db/migrations/ || true)
            if [ -n "$CAMBIADAS" ]; then
              echo "::error::Se modificaron migraciones ya existentes:"
              echo "$CAMBIADAS"
              echo "Crea una migración nueva en vez de editar una aplicada."
              exit 1
            fi
          fi

  contra-postgres-real:
    name: Migraciones contra Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: oncue
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node db/migrate.mjs "postgres://mc:mc@localhost:5432/oncue" --seed
      - name: Aplicar dos veces debe ser inocuo
        run: node db/migrate.mjs "postgres://mc:mc@localhost:5432/oncue" --seed

  calidad:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test
      - name: Build del dashboard
        run: pnpm --filter @mc/web build
