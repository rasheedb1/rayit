name: CI

# Puerta de calidad del repositorio. Con dos programadores trabajando en
# paralelo, esto es lo que evita que una rama rompa a la otra.
# Lo más importante: la verificación del esquema corre SIN base de datos
# (Postgres embebido), así que cada pull request valida las migraciones
# en menos de un minuto.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esquema:
    name: Migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix platform
      - name: Verificar que las migraciones aplican en limpio
        run: node platform/db/migrate.mjs --pglite
      - name: Verificar que ninguna migración aplicada fue modificada
        run: |
          # Una migración ya desplegada es inmutable. Si cambió, el
          # runner falla, pero aquí lo detectamos antes con git.
          git fetch origin main --depth=1 || true
          if git rev-parse origin/main >/dev/null 2>&1; then
            CAMBIADAS=$(git diff --name-only --diff-filter=M origin/main -- platform/db/migrations/ || true)
            if [ -n "$CAMBIADAS" ]; then
              echo "::error::Se modificaron migraciones ya existentes:"
              echo "$CAMBIADAS"
              echo "Crea una migración nueva en vez de editar una aplicada."
              exit 1
            fi
          fi

  contra-postgres-real:
    name: Migraciones contra Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: multicampaign
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix platform
      - run: node platform/db/migrate.mjs "postgres://mc:mc@localhost:5432/multicampaign" --seed
      - name: Aplicar dos veces debe ser inocuo
        run: node platform/db/migrate.mjs "postgres://mc:mc@localhost:5432/multicampaign"

  lint:
    name: Tipos y formato
    runs-on: ubuntu-latest
    if: hashFiles('platform/pnpm-lock.yaml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: platform
      - run: pnpm turbo run typecheck lint
        working-directory: platform
