# =====================================================================
# Entorno local completo. Un solo comando y los dos programadores
# tienen exactamente lo mismo: `make up`.
# =====================================================================
name: multicampaign

services:
  db:
    image: postgres:16-alpine
    container_name: mc-db
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: multicampaign
      # Español para ordenamientos y mensajes coherentes con producción.
      LANG: es_ES.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d multicampaign"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de archivos compatible con S3. En producción es
  # Cloudflare R2 o S3; en local, MinIO con la misma API.
  storage:
    image: minio/minio:latest
    container_name: mc-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mc
      MINIO_ROOT_PASSWORD: mcmcmcmc
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket al arrancar para que nadie tenga que entrar a la consola.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://storage:9000 mc mcmcmcmc; do sleep 2; done;
      mc mb --ignore-existing local/mc-videos;
      mc mb --ignore-existing local/mc-frames;
      mc anonymous set download local/mc-frames;
      echo 'buckets listos';
      "

  # Servidor de correo falso: los pitches de outbound y los reportes se
  # ven en http://localhost:8025 sin enviar nada al mundo real.
  mail:
    image: axllent/mailpit:latest
    container_name: mc-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
  storage_data:
